          cat > src/main/java/com/dutoza/privatevault/PushService.java <<'EOF_FILE'
          package com.dutoza.privatevault;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Intent;

          import com.google.firebase.messaging.FirebaseMessagingService;
          import com.google.firebase.messaging.RemoteMessage;

          import java.util.Map;

          /* Inapokea arifa za juu ya simu kutoka Firebase (hata app ikiwa imefungwa) na kuzionyesha. */
          public class PushService extends FirebaseMessagingService {

              @Override
              public void onNewToken(String token) {
                  getSharedPreferences("vault", MODE_PRIVATE).edit().putString("fcm_token", token).apply();
              }

              @Override
              public void onMessageReceived(RemoteMessage message) {
                  Map<String, String> d = message.getData();
                  String title = d.get("title");
                  String body = d.get("body");
                  String link = d.get("link");
                  if (title == null || title.isEmpty()) title = "Private Vault";
                  show(title, body == null ? "" : body, link == null ? "" : link);
              }

              private void show(String title, String body, String link) {
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      if (nm == null) return;
                      if (nm.getNotificationChannel("arifa") == null) {
                          NotificationChannel ch = new NotificationChannel(
                                  "arifa", "Arifa za Private Vault", NotificationManager.IMPORTANCE_HIGH);
                          nm.createNotificationChannel(ch);
                      }
                      Intent i = new Intent(this, MainActivity.class);
                      i.putExtra("link", link);
                      i.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP
                              | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      int id = (int) (System.currentTimeMillis() & 0x7fffffff);
                      PendingIntent pi = PendingIntent.getActivity(this, id, i,
                              PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                      Notification.Builder b = new Notification.Builder(this, "arifa");
                      b.setSmallIcon(R.drawable.ic_stat)
                              .setContentTitle(title)
                              .setContentText(body)
                              .setStyle(new Notification.BigTextStyle().bigText(body))
                              .setColor(0xFF1F883D)
                              .setContentIntent(pi)
                              .setAutoCancel(true);
                      nm.notify(id, b.build());
                  } catch (Exception ignored) {
                  }
              }
          }
